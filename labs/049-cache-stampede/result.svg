<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
<title id="t">DB queries at cache expiry per strategy</title>
<desc id="d">잠금 없음: 101 DB queries, 0 waiters; 단일 갱신 락: 1 DB queries, 100 waiters; 조기 갱신: 0 DB queries, 0 waiters. 2000 reads per second.</desc>
<rect width="900" height="380" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a">
<text x="28" y="40" font-size="22" font-weight="bold">Cache stampede at expiry: DB queries (2,000 reads/s)</text>
<line x1="90" y1="290" x2="850" y2="290" stroke="#94a3b8"/>
<rect x="141.7" y="70.0" width="150" height="220.0" fill="#2563eb"/>
<text x="216.7" y="64.0" font-size="13" text-anchor="middle">101 queries</text>
<text x="216.7" y="312" font-size="12" text-anchor="middle">잠금 없음</text>
<text x="216.7" y="330" font-size="12" text-anchor="middle">waiters: 0</text>
<rect x="395.0" y="287.8" width="150" height="2.2" fill="#2563eb"/>
<text x="470.0" y="281.8" font-size="13" text-anchor="middle">1 queries</text>
<text x="470.0" y="312" font-size="12" text-anchor="middle">단일 갱신 락</text>
<text x="470.0" y="330" font-size="12" text-anchor="middle">waiters: 100</text>
<rect x="648.3" y="288.0" width="150" height="2.0" fill="#2563eb"/>
<text x="723.3" y="282.0" font-size="13" text-anchor="middle">0 queries</text>
<text x="723.3" y="312" font-size="12" text-anchor="middle">조기 갱신</text>
